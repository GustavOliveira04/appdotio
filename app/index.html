<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volume de CBUQ</title>
<link rel="stylesheet" href="./styles/styles.css">
<script src="./scripts/scripts.js" defer></script>
</head>
<body>
<header>
  <h1>Volume de CBUQ</h1>
  <p>Cálculo baseado na planilha: área por estaca, volume pelo método das áreas médias e total em toneladas.</p>
</header>

<main>
  <div class="config-card">
    <div class="config-title">Parâmetro</div>
    <div class="config-grid" style="grid-template-columns:1fr;">
      <div class="config-field">
        <label>Densidade (ton/m³)</label>
        <input type="text" inputmode="decimal" id="cfg-densidade" value="2,55">
      </div>
    </div>
  </div>

  <div id="rows-container"></div>
</main>

<div class="total-bar">
  <div class="total-stat">
    <span class="label">Volume total</span>
    <span class="value" id="total-volume">0,00 m³</span>
  </div>
  <div class="total-stat">
    <span class="label">CBUQ total</span>
    <span class="value" id="total-cbuq">0,00 ton</span>
  </div>
</div>

<script>/* ...JS abaixo... */</script>
</body>
</html>
